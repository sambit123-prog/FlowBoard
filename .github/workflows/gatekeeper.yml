name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-22.04   # Stable runner
    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check previous workflow results
        uses: actions/github-script@v8
        with:
          script: |
            const workflows = ['codeql.yml', 'deploy.yml', 'sonar.yml'];
            const results = await Promise.all(workflows.map(async wf => {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                head_sha: context.payload.pull_request.head.sha
              });
              return runs.data.workflow_runs[0]?.conclusion === 'success';
            }));

            const failed = workflows.filter((wf, i) => !results[i]);
            if (failed.length > 0) {
              core.setFailed(`Failed workflows: ${failed.join(', ')}`);
            }
