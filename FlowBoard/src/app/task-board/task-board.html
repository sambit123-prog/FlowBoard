<section class="task-board-page">
  <mat-card class="task-form-card">
    <mat-card-title>Add a task</mat-card-title>
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Task title</mat-label>
        <input matInput [(ngModel)]="newTitle" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Notes</mat-label>
        <textarea matInput rows="3" [(ngModel)]="newNotes"></textarea>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button mat-flat-button color="primary" (click)="addTask()">Add task</button>
    </mat-card-actions>
  </mat-card>

  <div class="task-columns" cdkDropListGroup>
    <mat-card class="task-column">
      <mat-card-title>Pending</mat-card-title>
      <mat-card-content>
        <div cdkDropList [cdkDropListData]="tasks.filter(task => !task.completed)" (cdkDropListDropped)="drop($event)">
          <mat-list>
            <mat-list-item *ngFor="let task of tasks.filter(task => !task.completed)" cdkDrag>
              <div class="task-item">
                <div>
                  <div class="task-title">{{ task.title }}</div>
                  <div class="task-notes" *ngIf="task.notes">{{ task.notes }}</div>
                </div>
                <div class="task-actions">
                  <button mat-icon-button color="primary" (click)="toggleComplete(task)"><mat-icon>check</mat-icon></button>
                  <button mat-icon-button color="warn" (click)="removeTask(task)"><mat-icon>delete</mat-icon></button>
                </div>
              </div>
            </mat-list-item>
          </mat-list>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="task-column">
      <mat-card-title>Completed</mat-card-title>
      <mat-card-content>
        <div cdkDropList [cdkDropListData]="tasks.filter(task => task.completed)" (cdkDropListDropped)="drop($event)">
          <mat-list>
            <mat-list-item *ngFor="let task of tasks.filter(task => task.completed)" cdkDrag>
              <div class="task-item completed">
                <div>
                  <div class="task-title">{{ task.title }}</div>
                  <div class="task-notes" *ngIf="task.notes">{{ task.notes }}</div>
                </div>
                <div class="task-actions">
                  <button mat-icon-button color="primary" (click)="toggleComplete(task)"><mat-icon>undo</mat-icon></button>
                  <button mat-icon-button color="warn" (click)="removeTask(task)"><mat-icon>delete</mat-icon></button>
                </div>
              </div>
            </mat-list-item>
          </mat-list>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</section>
